# ============================================================
# Audio - I2S Audio Setup and Speaker Configuration (PATCHED)
# ============================================================
# Patched for ESPHome 2026.5.0 speaker_source API changes.
# Source speaker IDs updated to match new _spk_ naming convention.
# ============================================================
substitutions:
  audio_buffer_duration: 100ms

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${i2s_lrclk_pin}
    i2s_bclk_pin: ${i2s_bclk_pin}

speaker:
  - platform: i2s_audio
    id: i2s_speaker_id
    i2s_audio_id: i2s_out
    sample_rate: 48000
    i2s_dout_pin: ${i2s_dout_pin}
    bits_per_sample: 16bit
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: ${audio_buffer_duration}
  - platform: mixer
    id: mixer_speaker_id
    output_speaker: i2s_speaker_id
    num_channels: 2
    task_stack_in_psram: ${task_stack_in_psram}
    source_speakers:
      - id: announcement_spk_mixer_input
        timeout: never
      - id: media_spk_mixer_input
        timeout: never
  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
    task_stack_in_psram: ${task_stack_in_psram}
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input
    task_stack_in_psram: ${task_stack_in_psram}
    sample_rate: 48000
    bits_per_sample: 16
