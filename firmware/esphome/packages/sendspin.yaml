# ============================================================
# Sendspin - Synchronized Multi-Room Audio (PATCHED)
# ============================================================
# Patched for ESPHome 2026.5.0 speaker_source API changes.
# Pipeline speaker references updated to use new _spk_ IDs.
# Original: github://sonocotta/esp32-audio-dock
# ============================================================

substitutions:
  media_player_led_control: "true"
  media_source_buffer_size: 200000

globals:
  - id: current_volume
    type: float
    initial_value: '0.2'
  - id: announcement_triggered
    type: bool
    initial_value: 'false'

text_sensor:
  - platform: sendspin
    type: title
    name: Track Title

  - platform: sendspin
    type: artist
    name: Artist

  - platform: sendspin
    type: album
    name: Album

sendspin:
  id: sendspin_hub
  task_stack_in_psram: ${task_stack_in_psram}

media_source:
  - platform: sendspin
    id: sendspin_source
    decode_memory: internal

  - platform: audio_http
    id: http_media_source
    buffer_size: ${media_source_buffer_size}

  - platform: audio_http
    id: http_announcement_source
    buffer_size: ${media_source_buffer_size}

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: "${friendly_name} Sendspin Player"

  - platform: speaker_source
    id: external_media_player
    name: "${friendly_name} Player"
    volume_increment: 0.05

    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      speaker: announcement_spk_resampling_input   # updated from announcement_mixer_input
      sources:
        - http_announcement_source

    media_pipeline:
      speaker: media_spk_resampling_input           # updated from media_resampling_speaker
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      sources:
        - sendspin_source
        - http_media_source

    on_announcement:
      - if:
          condition:
            - lambda: return (!id(announcement_triggered));
          then:
            - lambda: |-
                id(announcement_triggered) = true;
                id(current_volume) = id(external_media_player).volume;
            - if:
                condition:
                  lambda: return ${media_player_led_control};
                then:
                  - light.turn_on:
                      id: rgb_front_led
                      blue: 100%
                      red: 0%
                      green: 100%
                      brightness: 50%
            - mixer_speaker.apply_ducking:
                id: media_spk_mixer_input           # updated from media_mixer_input
                decibel_reduction: 40
                duration: 0.0s
            - wait_until:
                media_player.is_announcing: external_media_player
            - delay: 0.75s
            - media_player.volume_set:
                id: external_media_player
                volume: !lambda "return id(announce_volume).state / 100.0;"
            - wait_until:
                - not:
                    media_player.is_announcing: external_media_player
            - mixer_speaker.apply_ducking:
                id: media_spk_mixer_input           # updated from media_mixer_input
                decibel_reduction: 0
                duration: 1.0s
            - media_player.volume_set:
                id: external_media_player
                volume: !lambda "return id(current_volume);"
            - if:
                condition:
                  lambda: return ${media_player_led_control};
                then:
                  - light.turn_off:
                      id: rgb_front_led
            - lambda: id(announcement_triggered) = false;

    on_state:
      if:
        condition:
          and:
            - lambda: return (!id(announcement_triggered));
            - not:
                media_player.is_announcing: external_media_player
        then:
          - mixer_speaker.apply_ducking:
              id: media_spk_mixer_input             # updated from media_mixer_input
              decibel_reduction: 0
              duration: 1.0s

number:
  - platform: template
    name: ${friendly_name} Announce Volume
    id: announce_volume
    icon: mdi:volume-source
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    initial_value: 50
    optimistic: true
